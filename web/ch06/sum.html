<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기산계 합적누</title>
</head>
<body>
    <h2>누적합 계산기</h2>
    <input id="n" type="number" placeholder="너는 정수다.">
    <button id="btn">입력</button>
    <div id="result"></div>
</body>
</html>
<script>
    document.getElementById('btn').onclick=function(){
        const n=document.getElementById('n').value;
        let result=0;
        for(let i=1;i<=n;i++){
            result+=i
        }
        document.getElementById('result').textContent='누적합 : '+result;
    }
</script>
